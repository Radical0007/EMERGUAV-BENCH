[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emerguav-bench"
version = "0.1.0"
description = "Protocol-conditioned evaluation of emergency UAV decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "transformers>=4.49",
  "accelerate>=1.2",
  "datasets>=3.0",
  "peft>=0.14",
  "trl>=0.14",
  "backoff>=2.2",
  "num2words>=0.5.13",
  "pillow>=10.0",
  "safetensors>=0.4",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.7",
  "numpy>=1.24,<2.0",
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
